    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Saba Fatima's project sketchbook. Explore Flutter applications, computer vision tools, and applied AI through an interactive gallery and a collection of selected work." />
    <meta name="theme-color" content="#141b19" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <script>
      try {
        var t = localStorage.getItem('saba-portfolio-theme');
        t = (t === 'light' || t === 'dark') ? t : 'dark';
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
